<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení &bull; {{ app_name }}</title>
    <link rel="icon" type="image/png" href="https://staticeu.sweet.tv/images/v2/icons/categories/1000.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#030712',
                        card: '#0f172a',
                        border: '#1e293b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="/static/css/styles.css?v={{ app_version }}">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4 antialiased selection:bg-cyan-500 selection:text-white">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative animate-fade-in">
        
        <!-- Top Logo & Version -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 mx-auto mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
            </div>
            <div class="flex items-center justify-center gap-2 mb-1">
                <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">SWEET<span class="text-white">.tv</span></h1>
                <span class="text-xs px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-300 font-mono font-bold border border-cyan-700/80">v{{ app_version }}</span>
            </div>
            <p class="text-xs text-slate-400" data-i18n="login.subtitle">Zabezpečený IPTV Proxy Server &amp; Web TV Přehrávač</p>
        </div>

        <!-- Error Alert -->
        <div id="login-error-alert" class="hidden mb-5 bg-red-950/60 border border-red-500/40 text-red-200 text-xs rounded-xl p-3 flex items-start gap-2.5 animate-fade-in">
            <svg class="w-4 h-4 text-red-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span id="login-error-text">Chyba přihlášení</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label for="login-username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" data-i18n="login.username">Uživatelské jméno</label>
                <div class="relative">
                    <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    <input id="login-username" type="text" required autofocus autocomplete="username" placeholder="admin" class="input-form pl-10 h-10 text-xs">
                </div>
            </div>

            <div>
                <label for="login-password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" data-i18n="login.password">Heslo</label>
                <div class="relative">
                    <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <input id="login-password" type="password" required autocomplete="current-password" placeholder="••••••••" class="input-form pl-10 h-10 text-xs">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input id="login-remember" type="checkbox" checked class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-cyan-500 focus:ring-0 focus:ring-offset-0">
                    <span data-i18n="login.remember">Pamatovat si přihlášení (30 dní)</span>
                </label>
            </div>

            <button type="submit" id="btn-submit-login" class="btn-primary w-full py-2.5 text-xs font-bold rounded-xl mt-2 flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20">
                <span data-i18n="login.submit">Přihlásit se</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </form>

        <!-- Initial Setup Hint -->
        <div class="mt-6 pt-4 border-t border-slate-800/80 text-center text-[11px] text-slate-500">
            <span data-i18n="login.hint">Výchozí přihlášení po první instalaci:</span> <span class="font-mono text-cyan-400">admin</span> / <span class="font-mono text-cyan-400">admin</span>
        </div>

    </div>

    <!-- Scripts with Cache Busting -->
    <script src="/static/js/i18n.js?v={{ app_version }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("login-form");
            const submitBtn = document.getElementById("btn-submit-login");
            const errorAlert = document.getElementById("login-error-alert");
            const errorText = document.getElementById("login-error-text");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                errorAlert.classList.add("hidden");

                const username = document.getElementById("login-username").value.trim();
                const password = document.getElementById("login-password").value;
                const remember = document.getElementById("login-remember").checked;

                if (!username || !password) return;

                submitBtn.disabled = true;
                submitBtn.classList.add("opacity-75");

                try {
                    const res = await fetch("/api/auth/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password, remember })
                    });

                    const data = await res.json();
                    if (res.ok && data.status === "OK") {
                        window.location.href = "/";
                    } else {
                        errorText.textContent = data.detail || (typeof t === "function" ? t("login.failed") : "Neplatné přihlašovací jméno nebo heslo.");
                        errorAlert.classList.remove("hidden");
                    }
                } catch (err) {
                    errorText.textContent = "Chyba spojení se serverem. Zkontrolujte připojení k internetu.";
                    errorAlert.classList.remove("hidden");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove("opacity-75");
                }
            });
        });
    </script>
</body>
</html>
